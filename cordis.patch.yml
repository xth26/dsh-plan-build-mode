# Profile patch for dsh-plan-build-mode.
# Loaded automatically when the package is installed in a DSH profile.
#
# Deliberately a PURE INSERT (no `config:` block): the plugin market / live
# hot-mount path only applies pure inserts without a restart. Every
# OpenCode-aligned default lives in the plugin code instead:
#   planSandbox == buildSandbox == workspace-write
#   denyWriteTools: true, section: true
#   plansDirectory: .opencode/plans
#   externalDirectory.default: allow
- insert:
    - id: plan-build-mode
      name: '@xth26/dsh-plan-build-mode'
